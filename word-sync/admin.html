<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>心有灵犀 · 设置</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin">
  <main class="page">
    <section id="login" class="screen">
      <h1>心有灵犀 · 设置</h1>
      <form id="login-form" class="card">
        <label class="field"><span>管理密码</span><input id="password" type="password" autocomplete="current-password" required></label>
        <p id="login-error" class="error" role="alert"></p>
        <button class="primary" type="submit">进入</button>
      </form>
    </section>

    <section id="panel" class="screen" hidden>
      <div class="toolbar">
        <h1 style="flex:1">心有灵犀 · 设置</h1>
        <a class="link" href="./">打开游戏</a>
        <button id="logout" class="link" type="button">退出</button>
      </div>

      <form id="settings-form" class="card">
        <h2>游戏规则</h2>
        <div class="grid-2">
          <label class="field"><span>血量（格）</span><input id="lives" type="number" min="1" max="99" required></label>
          <label class="field"><span>每轮思考时间（秒）</span><input id="thinkSeconds" type="number" min="5" max="300" required></label>
          <label class="field"><span>输入限时（秒，0 = 不限时）</span><input id="inputSeconds" type="number" min="0" max="300" required></label>
        </div>
        <label class="check"><input id="noRepeat" type="checkbox">不允许使用已经出现过的词</label>
        <label class="check"><input id="requireSpeech" type="checkbox">必须通过语音识别检测才能点“准备”</label>
        <label class="field">
          <span>自定义起始词库（每行或用空格分隔一个词；留空则使用内置词库 <b id="builtin-count"></b> 个词）</span>
          <textarea id="customWords" rows="5" placeholder="留空 = 使用内置常用词库"></textarea>
        </label>
        <div class="toolbar">
          <button class="primary" type="submit">保存设置</button>
          <span id="settings-note" class="hint"></span>
        </div>
        <p class="hint">新设置对之后开始的对局生效，正在进行的对局不受影响。</p>
      </form>

      <div class="toolbar">
        <h2 style="flex:1">对局记录 <span id="session-count" class="hint"></span></h2>
        <button id="refresh" class="secondary" type="button">刷新</button>
        <button id="export-json" class="secondary" type="button">导出 JSON</button>
        <button id="export-csv" class="secondary" type="button">导出 CSV</button>
      </div>
      <p id="storage-note" class="hint"></p>
      <div id="sessions" class="screen" style="gap:10px"></div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
